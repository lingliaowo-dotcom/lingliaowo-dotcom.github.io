<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对方手机</title>
<link rel="stylesheet" href="assets/style.css?v=97">
<style>
  body{background:#04060b;overflow:hidden}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px}
  .hint-top{color:#33415e;font-size:12px;letter-spacing:4px;margin-bottom:18px;text-align:center}
  .phone{width:320px;max-width:92vw;height:600px;border:1px solid #1c2c4a;border-radius:34px;
    background:linear-gradient(165deg,#0a0f19 0%,#060a12 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.75), inset 0 1px 0 rgba(174,191,216,.06);
    padding:26px 18px 30px;position:relative;overflow:hidden;cursor:pointer;user-select:none}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:16px;
    background:#04060b;border-radius:10px;border:1px solid #131c2e}
  .camdot{position:absolute;top:17px;left:20px;width:5px;height:5px;border-radius:50%;
    background:#2f8f57;box-shadow:0 0 7px #2f8f57;opacity:0;pointer-events:none}
  .camdot.on{animation:campulse 2.4s ease-in-out infinite}
  @keyframes campulse{0%,100%{opacity:.35}50%{opacity:1}}
  .clock{color:#42536f;font-size:11px;letter-spacing:3px;text-align:right;font-family:var(--mono)}
  .sname{color:#dfe5ee;font-size:15px;letter-spacing:3px;text-align:center;margin-top:14px;font-weight:300}
  .sstatus{color:#33415e;font-size:10.5px;letter-spacing:2px;text-align:center;margin-top:5px}
  .screen{margin-top:16px;animation:scrfade .9s ease both}
  @keyframes scrfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bub{max-width:78%;padding:8px 13px;border-radius:14px;font-size:12.5px;line-height:1.8;
    margin:7px 0;color:#9fb0ca;background:#0e1626;border:1px solid #16233c;letter-spacing:1px}
  .bub.me{margin-left:auto;background:#16233c;color:#c9d6ea}
  .bub.dread-bub{background:#170d10;border-color:#3a1f22;color:#c9a09a}
  .sys{color:#33415e;font-size:10.5px;letter-spacing:2px;text-align:center;margin:12px 0}
  .sys.dread{color:#8a4a44}
  .fade{transition:opacity 1.8s}
  .draftbox{border:1px solid #22304a;border-radius:10px;padding:10px 12px;margin-top:14px}
  .draftbox .k{color:#33415e;font-size:10px;letter-spacing:2px}
  .draftbox .k.dread{color:#8a4a44}
  .draftbox .v{color:#aebfd8;font-size:13.5px;letter-spacing:2px;margin-top:5px;min-height:20px}
  .cursor{display:inline-block;width:1px;height:16px;background:#aebfd8;vertical-align:-3px;
    animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:0}}
  .alarmline{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid #131c2e;padding:13px 4px}
  .alarmline .t{color:#dfe5ee;font-family:var(--mono);font-size:26px;letter-spacing:3px}
  .alarmline .n{color:#5a6a84;font-size:12px;letter-spacing:3px}
  .typing{color:#6d80a0;font-size:11.5px;letter-spacing:2px;padding:6px 2px;min-height:24px}
  .recalled{color:#33415e;font-size:11.5px;letter-spacing:2px;text-align:center;font-style:italic}
  .phone.glitch{animation:gl .28s steps(2) 2}
  @keyframes gl{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
  .nextcue{margin-top:22px;color:#2c3a52;font-size:11px;letter-spacing:5px;text-align:center;
    animation:cue 2.6s ease infinite}
  @keyframes cue{0%,100%{opacity:.35}50%{opacity:.9}}
  .final-text{max-width:560px;margin-top:34px;text-align:center;display:none}
  .final-text.show{display:block}
  .fl{color:#c9d6ea;font-size:16px;line-height:2.5;letter-spacing:2px;opacity:0;
    transform:translateY(10px);transition:all 1.2s}
  .fl.on{opacity:1;transform:none}
  .fl.red{color:#e8b5b0}
  /* 中间闪烁的「你准备好了吗」：呼吸式明暗，点击进入结尾 */
  .readyhint{color:#aebfd8;font-size:15px;letter-spacing:14px;margin-top:24px;
    opacity:0;transition:opacity 1.2s;border-bottom:1px solid transparent;
    text-align:center;user-select:none}
  .readyhint.blink{opacity:1;animation:rhblink 1.6s ease-in-out infinite}
  .readyhint.ready{opacity:1;animation:none;border-bottom-color:#4a7dd6;cursor:pointer}
  .readyhint.ready:hover{color:#c9d6ea}
  @keyframes rhblink{0%,100%{opacity:.25}50%{opacity:1}}
  .skip{position:fixed;right:14px;bottom:12px;color:#22304a;font-size:10.5px;letter-spacing:2px;
    cursor:pointer;text-decoration:underline dotted;display:none}
  .skip.show{display:block}
</style>
</head>
<body>
<div class="stage">
  <div class="hint-top" id="hintTop">手机还有电。八年了，一直有人给它充电。把它翻过来。</div>

  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="camdot" id="camdot"></div>
    <div class="clock" id="clock">23:47</div>
    <div class="sname" id="sname">闻笛</div>
    <div class="sstatus" id="sstatus"></div>
    <div class="screen" id="screen"></div>
    <div class="nextcue" id="cue">点一下屏幕</div>
  </div>

  <div class="final-text" id="finalText">
    <div class="fl">他不是没有回。</div>
    <div class="fl">他是把「回」这个字，过成了日子。</div>
    <div class="fl red">这一页没有谜题。这一页，是他给你的。</div>
    <div class="fl red">现在，手机在你手里。未读 (1) —— 发信人：你。</div>
    <div class="fl red">闹钟也替你定好了。明早 08:08，它会响。</div>
  </div>
  <div id="waitDot" style="color:#33415e;font-size:14px;letter-spacing:6px;margin-top:20px;
    opacity:0;transition:opacity 1s;text-align:center">· · ·</div>
  <div class="readyhint" id="readyHint">你准备好了吗</div>
</div>
<div class="skip" id="skip">跳过这一页</div>

<script src="assets/game.js?v=97"></script>
<script>
if (DJ.gate(11)) main();
function main(){
  const rv = DJ.revisit("hisview");
  const $ = id => document.getElementById(id);
  let step = 0, lock = false;
  if (rv > 1) $("hintTop").textContent = "你又回来了。它数着：这是第 " + rv + " 次。";

  /* ---- 低频心跳（本页专用，不占用全局 sfx） ---- */
  let hbAC = null;
  function heartbeat(times, interval){
    try{
      hbAC = hbAC || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < times; i++){
        [0, 0.2].forEach(off => {
          const o = hbAC.createOscillator(), g = hbAC.createGain();
          o.type = "sine"; o.frequency.value = 52;
          const t0 = hbAC.currentTime + i * interval + off;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(0.09, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
          o.connect(g); g.connect(hbAC.destination);
          o.start(t0); o.stop(t0 + 0.22);
        });
      }
    } catch (e) {}
  }

  /* ---- 屏幕闪烁（接触不良的恐怖） ---- */
  function flicker(){
    const p = $("phone");
    p.style.transition = "none";
    p.style.opacity = .05;
    DJ.sfx.err();
    setTimeout(() => { p.style.opacity = 1; }, 140);
    setTimeout(() => { p.style.opacity = .2; }, 300);
    setTimeout(() => { p.style.transition = "opacity .5s"; p.style.opacity = 1; }, 460);
  }

  /* ---- 时钟被改写 ---- */
  function clockGlitch(txt, ms, stay){
    const c = $("clock");
    const old = c.textContent;
    c.textContent = txt; c.style.color = "#8a4a44";
    if (!stay) setTimeout(() => { c.textContent = old; c.style.color = ""; }, ms || 800);
  }

  const steps = [
    /* 0 · 未读 38 */
    {clock:"23:47", name:"闻笛", st:"未读消息 (38)", cue:"点一下屏幕",
     html:`<div class="bub">在吗</div><div class="bub">我好难受</div>
           <div class="bub">说不上来哪里难受。就是难受。</div>
           <div class="sys">还有 <span id="unread">34</span> 条未读</div>
           <div class="draftbox"><div class="k">他做的第一件事：</div>
           <div class="v">从头到尾，一条一条，翻到第七遍。</div></div>
           <div class="sys dread fade" id="unreadNote" style="opacity:0">八年的未读，半分钟就读完了。它很急。</div>`},
    /* 1 · 输入框草稿 */
    {clock:"23:52", name:"闻笛", st:"在线", cue:"点一下屏幕",
     html:`<div class="bub me">你为什么不回我</div><div class="bub me">你是不是在骗我</div>
           <div class="draftbox"><div class="k">他打了五个字，打了两分钟：</div>
           <div class="v"><span id="draft"></span><span class="cursor"></span></div>
           <div class="k" style="margin-top:6px">然后按了保存，不是发送。</div>
           <div class="k dread fade" id="draftNote" style="margin-top:6px;opacity:0">可你数过。光标后面，多出来过四个字。他保存的，不是他打完的那句。</div></div>`},
    /* 2 · 删掉 */
    {clock:"23:58", name:"闻笛", st:"在线", cue:"点一下屏幕",
     html:`<div class="sys">草稿已删除</div>
           <div class="sys">第 2921 天，重新开始计数。</div>
           <div class="bub me">没事了。我很好。真的。</div>
           <div class="draftbox"><div class="k">他退出去，打开了另一个软件：</div>
           <div class="v">同城领养 · 一只白色的猫</div>
           <div class="k" style="margin-top:6px">看了四分钟。没有联系卖家。</div>
           <div class="k dread" style="margin-top:6px">帖子发布于八年前。猫活不了八年。</div>
           <div class="k dread" style="margin-top:6px">浏览记录：这条帖子他看了 2921 次。每天一次，像上香。</div></div>`},
    /* 2.5 · 壁纸 */
    {clock:"23:59", name:"锁屏", st:"亮了三秒", cue:"点一下屏幕",
     html:`<div class="sys">他起身去倒水。手机在桌上亮了一下，又自己黑了。</div>
           <div class="sys">就这三秒：锁屏壁纸是纯黑的。没有图，没有字，什么都没有。</div>
           <div class="sys">这张壁纸，比这段聊天记录还要老。</div>
           <div class="sys dread fade" id="wallNote" style="opacity:0">你把亮度拉到了最高。<br>那不是黑色。是一间没开灯的屋子。<br>你认得这间屋子。你现在就坐在里面。</div>
           <div class="sys dread fade" id="wallNote2" style="opacity:0">照片右下角有半个人影。<br>坐的正是你现在这个位置。</div>
           <div class="sys dread fade" id="camNote" style="opacity:0">左上角那盏绿灯，是前置摄像头。<br>它亮了。</div>`},
    /* 3 · 电台 */
    {clock:"00:01", name:"闻笛", st:"对方频道：FM 08.8", cue:"点一下屏幕",
     html:`<div class="bub">「各位，晚安。」</div>
           <div class="bub fade" id="radioName" style="opacity:0">「晚安，${DJ.state.name || "X"}。」</div>
           <div class="bub me">晚安。</div>
           <div class="sys">这一句，他说给了黑掉的屏幕。没有人听见。</div>
           <div class="sys dread fade" id="radioNote" style="opacity:0">这个频道，八年前就停播了。</div>
           <div class="bub dread-bub fade" id="radioStop" style="opacity:0">「别回头。」</div>`},
    /* 4 · 闹钟 */
    {clock:"00:08", name:"闹钟", st:"1 个闹钟 · 已开启", cue:"点一下屏幕",
     html:`<div class="alarmline"><span class="t">08:08</span><span class="n">备注：大吉</span></div>
           <div class="sys">每天。八年。没有一天响过空。</div>
           <div class="sys">铃声是那首没有名字的钢琴曲。倒着放。</div>
           <div class="sys dread">你凑近听了。钢琴声底下还有一层：<br>呼吸声。贴着话筒的、很有耐心的呼吸声。</div>
           <div class="sys dread">录音时长八分零八秒。最后三秒，呼吸声笑了。</div>`},
    /* 5 · 最后一眼 */
    {clock:"00:09", name:"闻笛", st:"在线", cue:"",
     html:`<div class="bub me">在吗</div>
           <div class="sys">已读。</div>
           <div class="typing" id="typing">对方正在输入…</div>
           <div class="bub dread-bub" id="q" style="display:none">你看到第几遍了？</div>`},
    /* 6 · 撤回 */
    {clock:"00:09", name:"闻笛", st:"在线", cue:"", final:true,
     html:`<div class="bub me">在吗</div>
           <div class="sys">已读。</div>
           <div class="recalled">对方撤回了一条消息</div>
           <div class="sys dread" style="margin-top:16px">它只存在了四秒。刚好够你读完。</div>
           <div class="sys">屏幕熄灭。</div>
           <div class="sys dread fade" id="mirrorNote" style="opacity:0">黑屏是一面镜子。<br>你看见了自己。也看见你身后那把椅子——<br>它不是空的。</div>
           <div class="sys dread fade" id="greenNote" style="opacity:0">屏幕灭了。左上角的绿灯，还亮着。</div>`}
  ];

  function render(i){
    const s = steps[i];
    $("clock").textContent = s.clock;
    $("clock").style.color = "";
    $("sname").textContent = s.name;
    $("sstatus").textContent = s.st;
    $("cue").textContent = s.cue;
    const sc = $("screen");
    sc.style.animation = "none"; void sc.offsetWidth; sc.style.animation = "";
    sc.innerHTML = s.html;
    DJ.sfx.type();
    if (i === 0) unreadTick();
    if (i === 1) typeDraft();
    if (i === 3){
      setTimeout(() => { if (step !== 3) return;
        const n = $("wallNote"); if (n) n.style.opacity = 1;
        const p = $("phone"); p.classList.add("glitch");
        setTimeout(() => p.classList.remove("glitch"), 700);
        DJ.sfx.scare();
      }, 2400);
      setTimeout(() => { if (step !== 3) return;
        const n2 = $("wallNote2"); if (n2) n2.style.opacity = 1;
        DJ.sfx.scare();
      }, 5000);
      setTimeout(() => { if (step !== 3) return;
        $("camdot").classList.add("on");
        const cn = $("camNote"); if (cn) cn.style.opacity = 1;
        flicker();
      }, 7600);
    }
    if (i === 4){
      setTimeout(() => { if (step !== 4) return;
        const r = $("radioName"); if (r) r.style.opacity = 1;
        DJ.sfx.scare();
      }, 2200);
      setTimeout(() => { if (step !== 4) return;
        const rn = $("radioNote"); if (rn) rn.style.opacity = 1;
      }, 3800);
      setTimeout(() => { if (step !== 4) return;
        const rs = $("radioStop"); if (rs) rs.style.opacity = 1;
        flicker();
        DJ.sfx.scare();
      }, 5800);
    }
    if (i === 5){
      lock = true;
      heartbeat(5, 1.15);
      setTimeout(() => { if (step !== 5) return;
        const t = $("typing"); if (t) t.style.opacity = ".4"; }, 2600);
      setTimeout(() => { if (step !== 5) return;
        const t = $("typing"); if (t) t.style.display = "none";
        const q = $("q"); if (q) q.style.display = "block";
        clockGlitch("08:08", 900);
        DJ.sfx.scare();
      }, 4800);
      setTimeout(() => { if (step !== 5) return;
        $("sstatus").textContent = "对方距你 0.3 米";
        $("sstatus").style.color = "#8a4a44";
      }, 6200);
      setTimeout(() => { if (step !== 5) return;
        lock = false;
        $("sstatus").style.color = "";
        $("cue").textContent = "点一下屏幕";
      }, 7400);
    }
    if (s.final){
      lock = true;
      setTimeout(() => { if (step !== 6) return;
        const m = $("mirrorNote"); if (m) m.style.opacity = 1;
        DJ.sfx.scare();
      }, 2600);
      setTimeout(() => { if (step !== 6) return;
        const g = $("greenNote"); if (g) g.style.opacity = 1;
        clockGlitch("08:08", 0, true);
        heartbeat(3, 1.3);
      }, 4400);
      setTimeout(showEnd, 6800);
    }
  }

  /* 未读数当着你的面往下掉，越掉越快 */
  function unreadTick(){
    setTimeout(() => {
      if (step !== 0) return;
      let u = 34, delay = 850;
      const tick = () => {
        const el = $("unread");
        if (step !== 0 || !el) return;
        el.textContent = --u;
        DJ.sfx.type();
        if (u <= 0){
          $("sstatus").textContent = "未读消息 (0)";
          const n = $("unreadNote");
          if (n) n.style.opacity = 1;
          DJ.sfx.scare();
          return;
        }
        delay = Math.max(85, delay * 0.8);
        setTimeout(tick, delay);
      };
      tick();
    }, 3000);
  }

  /* 「其实我」打完两分钟后，光标后面自己多出四个字，再一个一个退掉 */
  function typeDraft(){
    const el = $("draft");
    const base = "其实我", extra = "看见你了";
    let k = 0;
    const t = setInterval(() => {
      if (step !== 1 || !document.body.contains(el)) { clearInterval(t); return; }
      el.textContent = base.slice(0, ++k);
      DJ.sfx.type();
      if (k >= base.length){
        clearInterval(t);
        setTimeout(() => {
          if (step !== 1) return;
          let j = 0;
          const t2 = setInterval(() => {
            if (step !== 1 || !document.body.contains(el)) { clearInterval(t2); return; }
            el.textContent = base + extra.slice(0, ++j);
            if (j === 1){ DJ.sfx.scare(); flicker(); } else DJ.sfx.type();
            if (j >= extra.length){
              clearInterval(t2);
              setTimeout(() => {
                if (step !== 1) return;
                const t3 = setInterval(() => {
                  if (step !== 1 || !document.body.contains(el)) { clearInterval(t3); return; }
                  el.textContent = base + extra.slice(0, --j);
                  if (j <= 0){
                    clearInterval(t3);
                    el.textContent = base;
                    const n = $("draftNote"); if (n) n.style.opacity = 1;
                  }
                }, 110);
              }, 1500);
            }
          }, 720);
        }, 900);
      }
    }, 420);
  }

  function showEnd(){
    $("hintTop").style.opacity = 0;
    $("phone").style.transition = "opacity 1.6s, transform 1.6s";
    $("phone").style.opacity = .18;
    $("phone").style.transform = "scale(.96)";
    $("finalText").classList.add("show");
    const fls = document.querySelectorAll(".fl");
    fls.forEach((f, i) => setTimeout(() => { f.classList.add("on"); DJ.sfx.type(); }, 600 + i * 1800));
    /* 最后一行文案出来时给呼吸点，然后闪烁「你准备好了吗」，最后才出按钮 */
    const tLast = 600 + (fls.length - 1) * 1800;
    setTimeout(() => { $("waitDot").style.opacity = 1; }, tLast + 600);
    setTimeout(() => {
      $("waitDot").style.opacity = 0;
      $("readyHint").classList.add("blink");
    }, tLast + 1400);
    /* 闪烁 2.4 秒后，文字保持可见，点击即可进入结尾 */
    setTimeout(() => {
      $("readyHint").classList.remove("blink");
      $("readyHint").classList.add("ready");
      $("skip").classList.add("show");
      DJ.flag("hisview_done");
    }, tLast + 3800);
  }

  $("phone").onclick = () => {
    if (lock || step >= steps.length - 1) { if (!lock && step === steps.length - 1){ lock = true; render(step); } return; }
    DJ.sfx.click();
    render(++step);
  };
  $("readyHint").onclick = () => {
    if (!$("readyHint").classList.contains("ready")) return;
    DJ.unlock(12); DJ.sfx.ok();
    document.body.classList.add("flash");
    setTimeout(() => location.href = "final.html", 420);
  };
  $("skip").onclick = e => {
    e.stopPropagation();
    DJ.unlock(12); DJ.sfx.click();
    location.href = "final.html";
  };

  /* 断点续玩：看过的人直接给入口，不再逼你重看一遍 */
  if (DJ.has("hisview_done")){
    lock = true;
    $("phone").style.opacity = .18;
    $("finalText").classList.add("show");
    document.querySelectorAll(".fl").forEach(f => f.classList.add("on"));
    $("readyHint").classList.add("blink");
    setTimeout(() => {
      $("readyHint").classList.remove("blink");
      $("readyHint").classList.add("ready");
      $("skip").classList.add("show");
    }, 2400);
  } else {
    render(0);
  }

  DJ.envHint("这一页不用解。看着就行。反正它一直在看你。", "hv1", 150);
}
</script>
</body>
</html>
