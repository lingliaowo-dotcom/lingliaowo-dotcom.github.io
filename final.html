<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>　</title>
<link rel="stylesheet" href="assets/style.css?v=98">
<style>
  body{background:#04070d}
  .stage{transition:opacity 1.2s}
  .stage.hide{opacity:0;pointer-events:none}

  /* 密码框 */
  #pLabel{color:#aebfd8;letter-spacing:14px;font-size:20px;margin-bottom:30px}
  #pw{max-width:320px;text-align:center;font-size:17px;letter-spacing:6px}
  #pwTip{color:#42536f;font-size:12px;letter-spacing:3px;margin-top:16px;min-height:20px}
  #failCount{color:#33415e;font-size:11px;letter-spacing:2px;margin-top:8px}

  /* 留白 */
  #paper{
    width:min(480px,90vw);height:340px;background:#dfe5ee;border-radius:3px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;padding:30px;
    display:flex;align-items:center;justify-content:center;transform:rotate(-.6deg);
  }
  #paper input{background:transparent;border:none;border-bottom:1px solid #b9c2d2;border-radius:0;
    color:#3a3f4a;text-align:center;font-size:17px;letter-spacing:4px}

  /* 终幕 */
  #endo{position:fixed;inset:0;background:#000;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:100}
  #endo.show{display:flex;animation:fadein 2.5s ease both}
  #bflyLogo{margin-bottom:40px}
  #readlog{color:#6d80a0;font-size:13px;letter-spacing:3px;line-height:2.4;text-align:center;min-height:120px}
  .readline{opacity:0;transition:opacity .8s}
  .readline.on{opacity:1}
  #synth{margin-top:22px;color:#8b9ab5;font-size:13.5px;letter-spacing:3px;line-height:2.6;text-align:center;min-height:20px}
  #synth .kline{color:#aebfd8}
  #mirrorFinal{margin-top:30px;color:#e8edf5;font-size:17px;letter-spacing:4px;line-height:2.4;text-align:center;opacity:0;transition:opacity 2.5s;white-space:pre-line}
  #credits{margin-top:46px;color:#33415e;font-size:11.5px;letter-spacing:4px;opacity:0;transition:opacity 2s;text-align:center;line-height:2.4}
  #credits a{color:#5a6a84;text-decoration:none;letter-spacing:4px}
  #credits a:hover{color:#aebfd8}
</style>
</head>
<body>

<!-- 阶段一：顺其自然 -->
<div class="stage" id="stPw">
  <div id="pLabel">顺 其 自 然</div>
  <input type="text" id="pw" autocomplete="off" placeholder="输入">
  <div id="pwTip"></div>
  <div id="failCount"></div>
</div>

<!-- 阶段二：留白 -->
<div class="stage hide" id="stBlank">
  <div id="paper">
    <input type="text" id="blankInput" autocomplete="off" placeholder="">
  </div>
  <div id="blankTip" class="small" style="margin-top:40px;letter-spacing:4px;min-height:20px"></div>
</div>

<!-- 终幕 -->
<div id="endo">
  <div id="bflyLogo">
    <video id="bvideo" src="assets/media/butterfly.mp4" autoplay muted loop playsinline
      style="width:min(420px,80vw);border-radius:10px;opacity:.9;filter:contrast(1.05)"></video>
  </div>
  <div id="readlog"></div>
  <div id="synth"></div>
  <div id="mirrorFinal"></div>
</div>

<div id="envhint"></div>
<script src="assets/game.js?v=98"></script>
<script>
  const PEEK = location.search.indexOf("peek") !== -1; /* 主页彩蛋：不写存档，直接看结尾 */
  if (PEEK || DJ.gate(11)) main();
function main(){
  if (!PEEK) DJ.unlock(11);
  const $ = id => document.getElementById(id);

  /* ---------- 阶段一：顺其自然，永远错误 ---------- */
  const pw = $("pw");
  let fails = Math.max(0, DJ.state.fails || 0);
  let submitTimes = [];
  function fail(msg){
    fails++;
    if (!PEEK){ DJ.state.fails = fails; DJ.save(); }
    DJ.sfx.err();
    pw.classList.add("shake"); setTimeout(()=>pw.classList.remove("shake"), 420);
    $("pwTip").textContent = msg;
    $("failCount").textContent = "错误 " + fails + " 次";
    pw.select();
  }
  function submit(){
    const v = pw.value.trim();
    if (!v) { fail("……"); return; }
    const now = Date.now();
    submitTimes.push(now);
    submitTimes = submitTimes.slice(-3);
    /* 乱按检测：连续三次提交间隔都小于 0.9 秒 */
    let mashing = submitTimes.length === 3 &&
      submitTimes[1]-submitTimes[0] < 900 && submitTimes[2]-submitTimes[1] < 900;
    if (mashing || fails >= 5){ pass1(); return; }
    if (v.includes("顺其自然")) fail("错误。");
    else fail("错误。");
  }
  pw.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });

  function pass1(){
    DJ.sfx.read();
    $("pwTip").innerHTML = "　";
    const st = $("stPw");
    st.style.transition = "opacity 2s";
    st.classList.add("hide");
    setTimeout(() => {
      st.style.display = "none";
      $("blankTip").textContent = "（没有题目。没有提示。没有标准答案。）";
      const sb = $("stBlank"); sb.classList.remove("hide");
      $("blankInput").focus();
    }, 2000);
  }

  /* ---------- 留白提交：把答案留在档案里 ---------- */
  $("blankInput").addEventListener("keydown", e => {
    if (e.key === "Enter"){
      const v = $("blankInput").value;
      if (!PEEK){ DJ.state.blank = v.trim(); DJ.save(); }
      $("blankInput").disabled = true;
      $("blankInput").value = "";
      $("blankInput").placeholder = v ? "「" + v + "」" : "（空白也是答案）";
      $("blankTip").textContent = "你终于不再试图寻找标准答案了。";
      $("blankTip").style.color = "#aebfd8";
      DJ.sfx.ok();
      setTimeout(endo, 3200);
    }
  });

  /* ---------- 终幕 ---------- */
  function endo(){
    if (!PEEK){ DJ.state.done = true; DJ.save(); }
    $("stBlank").style.display = "none";
    document.body.classList.add("flash");
    const e = $("endo"); e.classList.add("show");
    DJ.sfx.read();

    /* 镜中人独白 */
    setTimeout(() => {
      const mf = $("mirrorFinal");
      mf.textContent = "鏡中人\n你站在玻璃前。玻璃裡的那個人，\n鬍子拉碴，眼神陌生，胸前沒有廠牌。\n你盯了他很久。他也盯著你。\n然後你笑了。他也笑了。\n這場對視，持續了三十年。";
      mf.style.opacity = 1;
      DJ.sfx.read();
    }, 1200);
    /* 最后的最后：不是台词，是歌 */
    const box = $("synth");
    const song = ["如此生活30年", "直到大廈崩塌", "雲層深處的黑暗啊", "淹沒心底的景觀"];
    song.forEach((s, i) => {
      setTimeout(() => {
        const d = document.createElement("div");
        d.className = "readline";
        d.textContent = s;
        box.appendChild(d);
        requestAnimationFrame(() => d.classList.add("on"));
        DJ.sfx.type();
      }, 7200 + i * 1800);
    });
  }

  /* 环境提示（温柔到最后一刻） */
  DJ.envHint("这四个字，你试过按规矩来。这次，不按规矩试试。", "fn1", 45);
  DJ.envHint("不是让你乱来。是让你不较劲。这两者不一样。", "fn2", 120);

  DJ.injectDivine({
    clear:[ "上上签：这一关，签帮不了你。签只能告诉你：帮不了，也是一种答案。",
            "上上签：闭上眼睛，把手指放在键盘上，让它们自己走。" ],
    poetic:["中平签：大巧若拙，大智若愚，大正确若不正确。", "中平签：天之道，不争而善胜。" ],
    empty:[ "下下签：别问签了。问你自己累不累。", "下下签：……" ]
  });
}
</script>
</body>
</html>
