<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大吉论坛</title>
<link rel="stylesheet" href="assets/style.css?v=93">
<style>
  body{display:flex;min-height:100vh;background:
    radial-gradient(ellipse at 50% 6%,rgba(96,124,168,.20) 0%,rgba(96,124,168,0) 46%),
    linear-gradient(180deg,#1b2536 0%,#151d2b 42%,#101724 100%);
    background-attachment:fixed}
  .gate{text-align:center;padding:40px 24px 70px;max-width:560px;margin:auto}
  .wing svg{display:block;margin:0 auto}
  h1{color:#e8edf5;font-weight:300;font-size:34px;letter-spacing:18px;margin:34px 0 0;text-indent:18px}
  .sub{color:#7c8ca6;font-size:12.5px;letter-spacing:4px;margin-top:18px;line-height:2.2}
  .sub b{color:#b8c6da;font-weight:400}
  #enter{
    margin-top:52px;background:none;border:1px solid #2c3a52;color:#aebfd8;
    padding:14px 64px;font-size:15px;letter-spacing:10px;text-indent:10px;cursor:pointer;
    font-family:inherit;transition:border-color .4s,color .4s;border-radius:2px;
  }
  #enter:hover{border-color:#4a7dd6;color:#e8edf5}
  #saveNote{color:#7c8ca6;font-size:11px;letter-spacing:2px;margin-top:26px;min-height:18px}
  .intro{margin:34px auto 0;max-width:460px;padding-top:22px;border-top:1px solid #24334d;
    color:#8b9ab5;font-size:11.5px;letter-spacing:1.5px;line-height:2.1;text-align:left}
  .intro p{margin:0 0 12px}
  .intro .tip{color:#b8c6da;margin-bottom:0}
  .foot{position:fixed;bottom:22px;left:0;right:0;text-align:center;
    color:#5f7291;font-size:10.5px;letter-spacing:3px}
</style>
</head>
<body>

<div class="gate">
  <div class="wing">
    <svg width="72" height="72" viewBox="0 0 24 24">
      <g fill="#dfe5ee">
        <path d="M12 12 C9 6, 3 5, 3 10 C3 14, 8 14, 11 12.5 Z"/>
        <path d="M12 12 C15 6, 21 5, 21 10 C21 14, 16 14, 13 12.5 Z"/>
        <ellipse cx="12" cy="11.4" rx="1.2" ry="3.2"/>
      </g>
    </svg>
  </div>
  <h1>大吉论坛</h1>
  <div class="sub">
    未读 <b>(38)</b> · 最后访问：八年前<br>
    这里所有的帖子，都只在等一个人。
  </div>
  <button id="enter">进 入</button>
  <div id="saveNote"></div>

  <div class="intro">
    <p>这是一部发生在 2008 年旧论坛与 2025 年深夜之间的中文叙事解谜游戏，共十二章。</p>
    <p>你要做的不是打怪，而是把一件被时间埋掉的事，一点点翻出来：拨一通不该拨的号，进一间只留一盏灯的茶室，翻一本怎么算都对不上的流水账，点开一个没有脸的帖子，最后在一面镜子里，看见一个你认识的人。</p>
    <p>没有倒计时，没有难度选项。只有需要你亲手去翻、去算、去数、去承认的东西。</p>
    <p class="tip">别急着通关——有些答案，第二次看才对。</p>
  </div>
</div>

<div class="foot">建议：深夜 · 耳机 · 一个人</div>

<script src="assets/game.js?v=93"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  /* 有存档：给一句不动声色的提示（继续/重开交给序章自己处理） */
  const NAMES = { 1:"错位的起源", 2:"未读", 3:"青云观", 4:"赛博仙人", 5:"大吉论坛", 6:"流水账",
                  7:"卷毛猫", 8:"第八楼", 9:"面具", 10:"档案室", 11:"镜中人", 12:"顺其自然" };
  try {
    if (DJ.state.name){
      if (DJ.state.done){
        $("saveNote").textContent = "你已经走完过一遍。它还记得你。";
      } else {
        const ch = Math.min(DJ.state.chapter || 1, 12);
        $("saveNote").textContent = "你上次走到：第 " + ch + " 章「" + NAMES[ch] + "」。它在原地等。";
      }
    }
  } catch (e) {}

  $("enter").onclick = () => {
    DJ.sfx.click();
    document.body.style.transition = "opacity .8s";
    document.body.style.opacity = 0;
    setTimeout(() => location.href = "prologue.html", 800);
  };
})();
</script>
</body>
</html>
