<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大吉论坛</title>
<link rel="stylesheet" href="assets/style.css?v=98">
<style>
  body{display:flex;min-height:100vh;
    background:radial-gradient(ellipse at 50% 0%,#f4efe3 0%,#eae4d4 52%,#ded6c3 100%);
    background-attachment:fixed;color:#3b352c}
  .gate{text-align:center;padding:40px 24px 70px;max-width:560px;margin:auto}
  .wing svg{display:block;margin:0 auto}
  h1{color:#2c2820;font-weight:300;font-size:34px;letter-spacing:18px;margin:34px 0 0;text-indent:18px}
  .sub{color:#6b6252;font-size:12.5px;letter-spacing:4px;margin-top:18px;line-height:2.2}
  .sub b{color:#3f382e;font-weight:400}
  #enter{
    margin-top:52px;background:rgba(255,255,255,.35);border:1px solid #b6ac97;color:#4a4237;
    padding:14px 64px;font-size:15px;letter-spacing:10px;text-indent:10px;cursor:pointer;
    font-family:inherit;transition:border-color .4s,color .4s,background .4s;border-radius:2px;
  }
  #enter:hover{border-color:#8a7f68;color:#221d16;background:rgba(255,255,255,.6)}
  #saveNote{color:#6b6252;font-size:11px;letter-spacing:2px;margin-top:26px;min-height:18px}
  .intro{margin:34px auto 0;max-width:460px;padding-top:22px;border-top:1px solid #cfc7b3;
    color:#5a5143;font-size:11.5px;letter-spacing:1.5px;line-height:2.1;text-align:left}
  .intro p{margin:0 0 12px}
  .intro .tip{color:#3b352c;margin-bottom:0}
  .foot{position:fixed;bottom:22px;left:0;right:0;text-align:center;
    color:#8a806c;font-size:10.5px;letter-spacing:3px}
</style>
</head>
<body>

<div class="gate">
  <div class="wing">
    <svg width="72" height="72" viewBox="0 0 24 24">
      <g fill="#5d5648">
        <path d="M12 12 C9 6, 3 5, 3 10 C3 14, 8 14, 11 12.5 Z"/>
        <path d="M12 12 C15 6, 21 5, 21 10 C21 14, 16 14, 13 12.5 Z"/>
        <ellipse cx="12" cy="11.4" rx="1.2" ry="3.2"/>
      </g>
    </svg>
  </div>
  <h1>大吉论坛</h1>
  <div class="sub">
    未读 <b>(38)</b> · 最后访问：八年前<br>
    这里所有的帖子，都只在等一个人。
  </div>
  <button id="enter">进 入</button>
  <div id="saveNote"></div>

  <div class="intro">
    <p>这是一部发生在 2008 年旧论坛与 2025 年深夜之间的中文叙事解谜游戏，共十一章。</p>
    <p>你要做的不是打怪，而是把一件被时间埋掉的事，一点点翻出来：拨一通不该拨的号，进一间只留一盏灯的茶室，翻一本怎么算都对不上的流水账，点开一个没有脸的帖子，最后在一面镜子里，看见一个你认识的人。</p>
    <p>没有倒计时，没有难度选项。只有需要你亲手去翻、去算、去数、去承认的东西。</p>
    <p class="tip">别急着通关——有些答案，第二次看才对。</p>
  </div>
</div>

<div class="foot" id="footTip" title="有些答案，结尾也在等">建议：深夜 · 耳机 · 一个人</div>

<script src="assets/game.js?v=98"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  /* 通关过的老玩家：给一句不动声色的招呼（进入后一律从序章按顺序开始） */
  try {
    if (DJ.state.name && DJ.state.done){
      $("saveNote").textContent = "你已经走完过一遍。它还记得你。";
    }
  } catch (e) {}

  $("enter").onclick = () => {
    DJ.sfx.click();
    document.body.style.transition = "opacity .8s";
    document.body.style.opacity = 0;
    setTimeout(() => location.href = "prologue.html", 800);
  };

  /* 彩蛋：点「深夜 · 耳机 · 一个人」，不写存档，直接看结尾 */
  const foot = $("footTip");
  foot.style.cursor = "pointer";
  foot.onclick = () => {
    DJ.sfx.click();
    document.body.style.transition = "opacity .8s";
    document.body.style.opacity = 0;
    setTimeout(() => location.href = "final.html?peek=1", 800);
  };
})();
</script>
</body>
</html>
